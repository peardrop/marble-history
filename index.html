<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marble Industry History — V2 Interactive Explorer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0b1214; --surface:#121d20; --surface2:#19282c; --surface3:#22353a;
  --border:#2a4046; --text:#d2f4f0; --text-muted:#7da8a5;
  --accent:#2dd4bf; --accent2:#5eead4; --accent3:#fb7185; --accent4:#f472b6; --accent5:#c084fc;
  --link:#f472b6; --link-bg:rgba(244,114,182,.12); --link-border:rgba(244,114,182,.34);
  --font-main:'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Instrument Sans',sans-serif;
  font-size:13px;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;}

/* ── HEADER ── */
header{padding:9px 16px 7px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;flex-wrap:wrap;}
.hdr-left{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
header h1{font-family:var(--font-main);font-size:16.5px;font-weight:700;color:var(--accent);letter-spacing:.02em;}
header p{color:var(--text-muted);font-size:11px;}
.hdr-right{display:flex;align-items:center;gap:6px;}
.search-inp{background:var(--surface2);border:1px solid var(--border);color:var(--text);
  padding:3px 9px;border-radius:3px;font-size:11px;font-family:inherit;width:150px;outline:none;}
.search-inp:focus{border-color:var(--accent);}
.util-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);
  padding:3px 9px;border-radius:3px;cursor:pointer;font-size:11px;font-family:inherit;transition:all .15s;}
.util-btn:hover{border-color:var(--accent);color:var(--text);}

/* ── CONTROLS ── */
.controls{display:flex;gap:6px;padding:6px 16px;border-bottom:1px solid var(--border);
  align-items:center;flex-shrink:0;flex-wrap:wrap;background:var(--surface);}
.tab-group{display:flex;gap:4px;}
.tab-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);
  padding:4px 11px;border-radius:3px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:500;transition:all .15s;}
.tab-btn.active{background:var(--accent);color:var(--bg);border-color:var(--accent);}
.tab-btn:hover:not(.active){border-color:var(--accent);color:var(--text);}

.filter-bar{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap;}
.filter-group{display:flex;gap:3px;align-items:center;flex-wrap:wrap;}
.filter-label{color:var(--text-muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-right:2px;}
.filter-btn{background:transparent;border:1px solid var(--border);color:var(--text-muted);
  padding:2px 7px;border-radius:2px;cursor:pointer;font-size:11px;font-family:inherit;transition:all .15s;}
.filter-btn.f-us.active    {color:#56B4E9;border-color:#56B4E9;background:rgba(86,180,233,.14);}
.filter-btn.f-mexico.active{color:#fb7185;border-color:#fb7185;background:rgba(251,113,133,.14);}
.filter-btn.f-europe.active{color:#2dd4bf;border-color:#2dd4bf;background:rgba(45,212,191,.14);}
.filter-btn.f-japan.active {color:#F0E442;border-color:#F0E442;background:rgba(240,228,66,.12);}
.filter-btn.f-china.active {color:#c084fc;border-color:#c084fc;background:rgba(192,132,252,.14);}
.filter-btn.ev-btn.active  {color:var(--accent);border-color:var(--accent);background:rgba(45,212,191,.15);}

/* Secondary sub-controls for Network & People */
#sub-controls{padding:5px 16px;border-bottom:1px solid var(--border);background:var(--bg);
  display:none;align-items:center;gap:6px;flex-wrap:wrap;flex-shrink:0;}
#sub-controls.vis{display:flex;}
.type-pill{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);
  padding:2px 8px;border-radius:12px;cursor:pointer;font-size:10px;display:inline-flex;align-items:center;gap:4px;
  transition:all .15s;user-select:none;}
.type-pill.active{color:var(--text);border-color:rgba(255,255,255,.35);background:var(--surface3);}
.type-dot{width:7px;height:7px;border-radius:50%;display:inline-block;}

/* ── STICKY HEADER AREA (legend) ── */
#sticky-header{flex-shrink:0;background:var(--bg);border-bottom:1px solid var(--border);display:none;}
#sticky-header.vis{display:block;}
#legend-bar{padding:5px 16px 4px;overflow-x:auto;white-space:nowrap;}
.lb-item{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--text-muted);margin-right:10px;}
.lb-swatch{display:inline-block;width:14px;height:8px;border-radius:1px;
  box-shadow:inset 2px 0 3px rgba(0,0,0,.4),inset -2px 0 3px rgba(0,0,0,.4);}
.lb-sep{display:inline-block;width:1px;height:12px;background:var(--border);vertical-align:middle;margin:0 8px 0 4px;opacity:.6;}

/* ── MAIN AREA ── */
.main{flex:1;display:flex;overflow:hidden;position:relative;}

/* ── TIMELINE (companies) ── */
#tl-view{flex:1;min-height:0;overflow-y:auto;overflow-x:auto;padding:6px 0 24px;}
.tl-scroll{min-width:720px;padding:0 16px;}
.tl-axis-tick{position:absolute;font-size:9px;color:var(--text-muted);transform:translateX(-50%);white-space:nowrap;}
.tl-grid{position:absolute;top:0;bottom:0;border-left:1px solid var(--border);opacity:.18;pointer-events:none;}
.tl-group-hdr{font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;
  color:var(--accent);padding:8px 0 2px;border-top:1px solid var(--border);margin-top:6px;}
.tl-group-hdr:first-of-type{border-top:none;margin-top:0;}
.tl-sub-hdr{font-size:9px;color:var(--text-muted);padding:2px 0;font-style:italic;opacity:.8;}
.tl-lane{position:relative;height:30px;margin-bottom:2px;}
.tl-bar{position:absolute;top:10px;height:16px;cursor:pointer;border-radius:2px;
  box-shadow:inset 3px 0 5px rgba(0,0,0,.45),inset -3px 0 5px rgba(0,0,0,.45),
             inset 0 1px 0 rgba(255,255,255,.15),inset 0 -1px 0 rgba(0,0,0,.3);
  transition:filter .15s, outline .15s;}
.tl-bar:hover{filter:brightness(1.25);}
.tl-bar.selected{outline:2px solid var(--accent);z-index:5;}
.tl-bar.search-hit{outline:2px solid #fff;z-index:6;}
.tl-ext{position:absolute;top:14px;height:8px;border-radius:2px;opacity:.28;pointer-events:none;
  box-shadow:inset 2px 0 4px rgba(0,0,0,.4),inset -2px 0 4px rgba(0,0,0,.4);}
.tl-label{position:absolute;top:0;height:10px;font-size:9.5px;font-weight:500;
  white-space:nowrap;overflow:visible;pointer-events:none;
  text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.95);
  line-height:10px;z-index:10;}
.tl-arrow{position:absolute;top:12px;font-size:9px;opacity:.8;pointer-events:none;}
.tl-bar.s-probable{opacity:.78;border:1px dashed rgba(255,255,255,.45);}
.tl-bar.s-estimate,.tl-bar.s-placeholder{
  opacity:.48;
  background-image:repeating-linear-gradient(45deg,transparent,transparent 3px,
    rgba(255,255,255,.09) 3px,rgba(255,255,255,.09) 6px)!important;}
.tl-chain-gap{position:absolute;top:17px;height:2px;
  border-top:1px dashed rgba(255,255,255,.28);pointer-events:none;}
.tl-unknown-item{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;margin:3px 6px 3px 0;
  background:var(--surface2);border:1px solid var(--border);border-radius:3px;
  font-size:11px;color:var(--text-muted);cursor:pointer;}
.tl-unknown-item:hover,.tl-unknown-item.sel{color:var(--text);border-color:var(--accent);}
.tl-unknown-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;opacity:.7;}

/* ── GRAPH (Network) ── */
#gv{flex:1;position:relative;overflow:hidden;display:none;}
#gsvg{width:100%;height:100%;}
.gnode circle{stroke-width:1.5;cursor:pointer;transition:r .15s;}
.gnode text{font-family:'Instrument Sans',sans-serif;font-size:10px;fill:var(--text);
  pointer-events:none;text-shadow:0 1px 3px #000,0 0 6px #000;}
.gnode.dim circle,.gnode.dim text{opacity:.12;}
.glink{fill:none;stroke-width:1.6;opacity:.6;cursor:pointer;}
.glink:hover{opacity:1;stroke-width:2.8;}
.glink.dim{opacity:.05;}
.glink.hi{opacity:1;stroke-width:2.6;}
.g-lone{font-size:11px;color:var(--text-muted);padding:8px 14px;
  position:absolute;bottom:0;left:0;right:0;background:rgba(26,25,22,.94);
  border-top:1px solid var(--border);max-height:78px;overflow-y:auto;}
.g-lone span.lone-chip{display:inline-block;margin:2px 4px;padding:2px 7px;
  border-radius:3px;background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);
  font-size:10px;cursor:pointer;}
.g-lone span.lone-chip:hover{color:var(--text);border-color:var(--accent);}
.g-instr{position:absolute;top:10px;right:12px;font-size:10px;
  color:var(--text-muted);pointer-events:none;background:rgba(15,14,12,.75);padding:3px 7px;border-radius:3px;}

/* ── PEOPLE & KINSHIP VIEW ── */
#pv{flex:1;display:none;flex-direction:column;overflow-y:auto;padding:14px 16px 32px;gap:18px;}
.pv-section-title{font-family:var(--font-main);font-size:14.5px;font-weight:600;color:var(--accent);
  border-bottom:1px solid var(--border);padding-bottom:5px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;}
.pv-section-title span{font-family:'Instrument Sans',sans-serif;font-size:11px;color:var(--text-muted);}
.dynasty-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
.dynasty-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:11px 13px;display:flex;flex-direction:column;gap:8px;}
.dynasty-hdr{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.06);padding-bottom:6px;}
.dynasty-title{font-weight:600;font-size:12.5px;color:var(--accent);}
.dynasty-co-pills{display:flex;gap:4px;flex-wrap:wrap;}
.co-mini-pill{font-size:9.5px;padding:1px 6px;border-radius:2px;cursor:pointer;background:var(--surface2);border:1px solid var(--border);color:var(--text);}
.co-mini-pill:hover{border-color:var(--link);color:var(--link);background:var(--link-bg);}
.rel-row{display:flex;align-items:center;gap:6px;font-size:11.5px;flex-wrap:wrap;padding:3px 0;}
.p-chip{color:var(--accent2);cursor:pointer;font-weight:500;padding:1px 5px;border-radius:2px;background:rgba(126,184,154,.08);border:1px solid rgba(126,184,154,.2);}
.p-chip:hover{background:rgba(126,184,154,.2);border-color:var(--accent2);}
.rel-badge{font-size:9px;text-transform:uppercase;letter-spacing:.05em;padding:1px 5px;border-radius:2px;background:var(--surface3);color:var(--text-muted);}
.rel-note{font-size:10px;color:var(--text-muted);font-style:italic;width:100%;padding-left:4px;}

.bridge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;}
.person-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:9px 11px;cursor:pointer;transition:border-color .15s;}
.person-card:hover,.person-card.sel{border-color:var(--accent);}
.pc-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:4px;}
.pc-name{font-weight:600;font-size:12px;color:var(--accent2);}
.pc-dates{font-size:10px;color:var(--text-muted);}
.pc-notes{font-size:10.5px;color:var(--text-muted);margin-bottom:6px;line-height:1.35;}
.pc-cos{display:flex;gap:4px;flex-wrap:wrap;}

/* ── SOURCES & METHODOLOGY VIEW ── */
#sv{flex:1;display:none;flex-direction:column;overflow-y:auto;padding:16px 18px 36px;gap:20px;}
.sv-hero{background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;}
.sv-hero h2{font-family:var(--font-main);font-size:15.5px;font-weight:600;color:var(--accent);}
.sv-hero p{font-size:12px;color:var(--text);line-height:1.55;}
.rubric-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:4px;}
.rubric-card{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:9px 11px;}
.rubric-hdr{font-weight:600;font-size:11.5px;color:var(--accent2);margin-bottom:3px;display:flex;justify-content:space-between;}
.rubric-desc{font-size:10.5px;color:var(--text-muted);line-height:1.4;}
.src-cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px;}
.src-cat-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:11px 13px;display:flex;flex-direction:column;gap:7px;}
.src-cat-title{font-weight:600;font-size:12.5px;color:var(--accent);border-bottom:1px solid rgba(255,255,255,.06);padding-bottom:5px;display:flex;justify-content:space-between;}
.src-item{display:flex;flex-direction:column;gap:3px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.03);}
.src-item:last-child{border-bottom:none;}
.src-item-link{color:var(--link);font-size:11.5px;text-decoration:none;font-weight:600;word-break:break-all;}
.src-item-link:hover{text-decoration:underline;color:#f9a8d4;}
.src-item-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px;}
.inline-src-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}

/* ── INSPECTOR PANEL (Desktop Drawer / Mobile Bottom Sheet) ── */
.panel{width:310px;flex-shrink:0;border-left:1px solid var(--border);
  background:var(--surface);padding:14px;overflow-y:auto;display:none;z-index:100;}
.panel.vis{display:block;}
.panel-hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px;}
.pname{font-family:var(--font-main);font-size:14.5px;font-weight:600;color:var(--accent);line-height:1.25;}
.panel-close{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);
  padding:2px 7px;border-radius:3px;cursor:pointer;font-size:11px;flex-shrink:0;}
.panel-close:hover{color:var(--text);border-color:var(--accent);}
.pmeta{color:var(--text-muted);font-size:11px;margin-bottom:9px;line-height:1.55;}
.psec{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);
  margin:11px 0 5px;border-bottom:1px solid var(--border);padding-bottom:2px;font-weight:600;}
.pconn{margin-bottom:6px;font-size:11px;line-height:1.4;padding:4px 6px;background:var(--surface2);border-radius:3px;border:1px solid rgba(255,255,255,.03);}
.cpill{display:inline-block;font-size:9px;padding:1px 5px;border-radius:2px;
  margin-right:4px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
.pnote{color:var(--text-muted);font-size:10px;margin-top:2px;font-style:italic;}
.pperson{font-size:11px;color:var(--accent2);margin-bottom:4px;cursor:pointer;padding:3px 5px;border-radius:2px;}
.pperson:hover{background:var(--surface2);}
.pco-link{color:var(--link);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-weight:500;}
.pco-link:hover{color:#f9a8d4;}
.badge{display:inline-block;font-size:9px;padding:1px 5px;border-radius:2px;margin-left:3px;text-transform:uppercase;font-weight:600;}
.badge-confirmed{background:rgba(45,212,191,.14);color:#5eead4;border:1px solid rgba(45,212,191,.35);}
.badge-probable{background:rgba(240,228,66,.12);color:#F0E442;border:1px dashed rgba(240,228,66,.45);}
.badge-estimate,.badge-placeholder,.badge-unconfirmed{background:rgba(251,113,133,.12);color:#fb7185;border:1px dotted rgba(251,113,133,.45);}
.badge-tier{background:var(--surface3);color:var(--accent2);border:1px solid var(--border);}

.src-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.src-link{display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--link);
  background:var(--link-bg);border:1px solid var(--link-border);padding:2px 6px;border-radius:3px;
  text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;transition:all .15s;}
.src-link:hover{background:rgba(244,114,182,.24);border-color:#f9a8d4;color:#fce7f3;}

.cpill-renamed    {background:rgba(192,132,252,.16);color:#d8b4fe;border:1px solid rgba(192,132,252,.35);}
.cpill-machines   {background:rgba(86,180,233,.16);color:#7dd3fc;border:1px solid rgba(86,180,233,.35);}
.cpill-staff      {background:rgba(45,212,191,.16);color:#5eead4;border:1px solid rgba(45,212,191,.35);}
.cpill-marbles    {background:rgba(240,228,66,.14);color:#fef08a;border:1px solid rgba(240,228,66,.35);}
.cpill-legal      {background:rgba(251,113,133,.16);color:#fda4af;border:1px solid rgba(251,113,133,.35);}
.cpill-visit      {background:rgba(203,213,225,.14);color:#e2e8f0;border:1px solid rgba(203,213,225,.3);}
.cpill-patent     {background:rgba(244,114,182,.16);color:#f9a8d4;border:1px solid rgba(244,114,182,.35);}
.cpill-resource   {background:rgba(148,163,184,.16);color:#cbd5e1;border:1px solid rgba(148,163,184,.35);}
.cpill-founded    {background:rgba(45,212,191,.12);color:#99f6e4;border:1px solid rgba(45,212,191,.3);}
.cpill-collaborator{background:rgba(192,132,252,.14);color:#e9d5ff;border:1px solid rgba(192,132,252,.3);}
.cpill-investor   {background:rgba(240,228,66,.12);color:#fde047;border:1px solid rgba(240,228,66,.3);}
.cpill-event      {background:rgba(251,113,133,.14);color:#fecdd3;border:1px solid rgba(251,113,133,.3);}

/* Mobile Bottom Sheet adaptation */
@media (max-width: 768px) {
  .panel{
    position:fixed;bottom:0;left:0;right:0;width:100%;max-height:64vh;
    border-left:none;border-top:2px solid var(--accent);
    box-shadow:0 -8px 28px rgba(0,0,0,.85);border-radius:10px 10px 0 0;
  }
  .controls{padding:6px 10px;}
  header{padding:8px 10px;}
  .search-inp{width:115px;}
}

/* ── FEEDBACK BTN, SPARKLINE & MILESTONES ── */
.fb-btn{display:inline-flex;align-items:center;gap:4px;background:var(--link-bg);border:1px solid var(--link-border);
  color:var(--link);padding:3px 9px;border-radius:3px;cursor:pointer;font-size:11px;font-weight:600;
  font-family:inherit;text-decoration:none;transition:all .15s;white-space:nowrap;}
.fb-btn:hover{background:rgba(244,114,182,.24);border-color:#f9a8d4;color:#fce7f3;}
.tl-spark-wrap{position:relative;height:50px;margin:2px 0 4px;border-bottom:1px solid rgba(42,64,70,.5);}
.tl-spark-label{position:absolute;top:2px;left:0;font-size:9px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--text-muted);pointer-events:none;z-index:2;background:rgba(11,18,20,.72);padding:1px 4px;border-radius:2px;}
.tl-spark-peak{position:absolute;top:2px;right:0;font-size:9px;color:var(--text-muted);pointer-events:none;z-index:2;
  background:rgba(11,18,20,.72);padding:1px 4px;border-radius:2px;}
.tl-milestone{position:absolute;top:0;bottom:0;border-left:1.5px dashed rgba(244,114,182,.45);z-index:1;pointer-events:none;}
.tl-ms-tag{position:absolute;top:2px;transform:translateX(-50%);font-size:8.5px;font-weight:600;
  color:#f9a8d4;background:rgba(18,29,32,.92);border:1px solid rgba(244,114,182,.4);
  padding:1px 5px;border-radius:2px;white-space:nowrap;pointer-events:auto;cursor:help;z-index:15;}
.gnode.search-hit circle{stroke:#fff !important;stroke-width:3 !important;}

/* ── TOOLTIP ── */
#tip{position:fixed;background:var(--surface2);border:1px solid var(--border);
  padding:5px 9px;border-radius:3px;font-size:11px;color:var(--text);
  pointer-events:none;display:none;z-index:300;max-width:280px;line-height:1.5;box-shadow:0 4px 12px rgba(0,0,0,.5);}
@media (hover: none) { #tip{display:none !important;} }

::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>
<body>
<div id="tip"></div>

<header>
  <div class="hdr-left">

function dispRegion(c){
  if(!c) return "Europe";
  if(c.country==="US" || c.country==="USA") return "US";
  if(c.country==="Mexico") return "Mexico";
  if(c.country==="Japan")  return "Japan";
  if(c.country==="China")  return "China";
  return "Europe";
}
function barBg(c){ return REGION_BG[c.country]||REGION_BG[dispRegion(c)]||"#444"; }
function barFg(c){ return REGION_FG[c.country]||REGION_FG[dispRegion(c)]||"#eee"; }
function p(y){ return ((y-MIN_Y)/SPAN*100).toFixed(4)+"%"; }
function pw(s,e){ return (Math.max((e-s)/SPAN*100,0.35)).toFixed(4)+"%"; }

// ── DATE HELPERS ──────────────────────────────────────────────────────────────
function isActive(c){
  if(c.company_active === true || c.company_active === 1) return true;
  if(c.company_active === false || c.company_active === 0) return false;
  return c.closed === null && c.founded !== null;
}
function effClosed(c){
  if(isActive(c)) return null;
  if(c.closed) return +c.closed;
  if(c.stopped) return +c.stopped;
  return (c.founded||MIN_Y)+10;
}
function coreSpan(c){
  const s = c.started || c.founded || MIN_Y;
  const ec = effClosed(c);
  const e = c.stopped || (ec===null ? MAX_Y : ec) || MAX_Y;
  return {s, e: Math.max(s+1, e)};
}
function extensions(c){
  const compEnd = isActive(c) ? MAX_Y : (effClosed(c)||MAX_Y);
  const left = (c.started && c.founded && c.founded < c.started) ? {s:c.founded, e:c.started} : null;
  const right = (c.stopped && c.stopped < compEnd) ? {s:c.stopped, e:compEnd} : null;
  return {left, right};
}
function fullSpan(c){
  const {s:cs, e:ce} = coreSpan(c);
  const {left, right} = extensions(c);
  return {s: left ? c.founded : cs, e: right ? (isActive(c)?MAX_Y:effClosed(c)||ce) : ce};
}

// ── LANE PACKING ──────────────────────────────────────────────────────────────
function packLanes(items){
  const sorted=[...items].sort((a,b)=>a.spanS-b.spanS);
  const ends=[];
  sorted.forEach(it=>{
    let placed=false;
    for(let i=0;i<ends.length;i++){
      if(it.spanS>=ends[i]+2){ends[i]=it.spanE;it.lane=i;placed=true;break;}
    }
    if(!placed){it.lane=ends.length;ends.push(it.spanE);}
  });
  return sorted;
}

// ── TIMELINE VIEW ─────────────────────────────────────────────────────────────
const GROUP_ORDER = ["US","Mexico","Japan","China","Europe"];

function buildSparkline(knownCos){
  const regs = ["US","Europe","Japan","Mexico","China"].filter(r=>FILTERS.has(r));
  const years = [];
  for(let y=MIN_Y; y<=MAX_Y; y+=2) years.push(y);
  const series = regs.map(r => years.map(y => {
    let cnt = 0;
    knownCos.forEach(c=>{
      if(dispRegion(c)!==r) return;
      const sp = coreSpan(c);
      if(y >= sp.s && y <= sp.e) cnt++;
    });
    return cnt;
  }));
  const totals = years.map((_,i)=>series.reduce((s,arr)=>s+arr[i],0));
  const maxTot = Math.max(1, ...totals);
  const peakIdx = totals.indexOf(maxTot);
  const peakYr = years[peakIdx];
  const W = 1000, H = 46;
  const xOf = y => ((y - MIN_Y) / SPAN * W).toFixed(1);
  const yOf = v => (H - (v / maxTot) * (H - 6)).toFixed(1);

  let cumPrev = years.map(()=>0);
  let paths = "";
  regs.forEach((r, ri)=>{
    const cumCurr = years.map((_,i)=>cumPrev[i] + series[ri][i]);
    let d = `M ${xOf(years[0])} ${yOf(cumCurr[0])}`;
    for(let i=1;i<years.length;i++) d += ` L ${xOf(years[i])} ${yOf(cumCurr[i])}`;
    for(let i=years.length-1;i>=0;i--) d += ` L ${xOf(years[i])} ${yOf(cumPrev[i])}`;
    d += " Z";
    paths += `<path d="${d}" fill="${NODE_COL[r]||'#2dd4bf'}" fill-opacity="0.38" stroke="${NODE_COL[r]||'#2dd4bf'}" stroke-width="0.9" stroke-opacity="0.8"/>`;
    cumPrev = cumCurr;
  });

  return `<div class="tl-spark-wrap">
    <span class="tl-spark-label">Active Makers Over Time (by Region)</span>
    <span class="tl-spark-peak">Peak: ${maxTot} active (${peakYr})</span>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:100%;display:block">
      ${paths}
    </svg>
  </div>`;
}

function renderTL(){
  const el = document.getElementById("tl-view");
  const knownCos   = COS.filter(c=>vis(c)&&c.founded!==null);
  const unknownCos = COS.filter(c=>vis(c)&&c.founded===null);
  const chainHandled = new Set();
  let html = `<div class="tl-scroll">`;

  // Active Makers Over Time stacked-area sparkline
  html += buildSparkline(knownCos);

  html += `<div style="position:sticky;top:0;z-index:20;background:var(--bg);
    border-bottom:1px solid var(--border);margin-bottom:2px;padding:3px 0 14px;">`;
  TICKS.forEach(y=>{html+=`<span class="tl-axis-tick" style="left:${p(y)}">${y}</span>`;});
  html += `</div>`;

  html += `<div style="position:relative">`;
  html += `<div style="position:absolute;inset:0;pointer-events:none;z-index:0">`;
  TICKS.forEach(y=>{html+=`<div class="tl-grid" style="left:${p(y)}"></div>`;});
  // Industry Milestone Markers (floating events/patents)
  const MILESTONES = [
    {year:1899, label:"1899 Polster Patent", tip:"1899: Polster German marble machine patent (No. 101,584), cited in Akro v. Master"},
    {year:1954, label:"1954 US Tariffs Lifted", tip:"1954: Post-war US tariffs lifted, opening floodgates to Japanese mass-produced cat's-eyes"}
  ];
  MILESTONES.forEach(ms=>{
    html += `<div class="tl-milestone" style="left:${p(ms.year)}">
      <span class="tl-ms-tag" onmouseenter="showTip(event,'${ms.tip.replace(/'/g,"&#39;")}')" onmouseleave="htip()">${ms.label}</span>
    </div>`;
  });
  html += `</div>`;

  GROUP_ORDER.forEach(gr=>{
    if(!FILTERS.has(gr)) return;
    const grCos = knownCos.filter(c=>dispRegion(c)===gr);
    if(!grCos.length) return;
    html += `<div class="tl-group-hdr">${gr} (${grCos.length})</div>`;

    const subMap = new Map();
    grCos.forEach(c=>{
      const k = c.country+"||"+((c.region||"").trim()||"—");
      if(!subMap.has(k)) subMap.set(k,[]);
      subMap.get(k).push(c);
    });
    const subKeys = [...subMap.keys()].sort((a,b)=>subMap.get(b).length-subMap.get(a).length||a.localeCompare(b));

    subKeys.forEach(sk=>{
      const items = subMap.get(sk);
      const [country,reg] = sk.split("||");
      const laneItems = [];
      items.forEach(c=>{
        const ch = idToChain.get(c.id);
        if(ch){
          const members = chainMembersVisible(ch);
          if(members.length > 1){
            const firstVis = members[0];
            const firstSk = firstVis.country+"||"+((firstVis.region||"").trim()||"—");
            if(sk !== firstSk) return; // Render entire lineage chain together in its origin subgroup
            if(chainHandled.has(ch[0])) return;
            chainHandled.add(ch[0]);
            const spanS = Math.min(...members.map(m=>fullSpan(m).s));
            const spanE = Math.max(...members.map(m=>fullSpan(m).e));
            laneItems.push({type:"chain",ch,members,spanS,spanE});
            return;
          }
        }
        const {s,e} = fullSpan(c);
        laneItems.push({type:"solo",c,spanS:s,spanE:e});
      });
      if(!laneItems.length) return;
      if(subKeys.length>1){
        const hasCrossRegionChain = laneItems.some(it=>it.type==="chain" && new Set(it.members.map(m=>m.region)).size>1);
        const chainRegs = hasCrossRegionChain ? [...new Set(laneItems.flatMap(it=>it.type==="chain"?it.members.map(m=>m.region):[reg]).filter(Boolean))].join(" → ") : reg;
        const lbl = reg==="—" ? `${country} — region unspecified` : `${chainRegs}, ${country}`;
        html += `<div class="tl-sub-hdr">${lbl}</div>`;
      }
      const packed = packLanes(laneItems);
      const numLanes = packed.length ? Math.max(...packed.map(x=>x.lane))+1 : 0;
      for(let lane=0; lane<numLanes; lane++){
        html += `<div class="tl-lane">`;
        const laneRow = packed.filter(x=>x.lane===lane);
        laneRow.forEach((item,idx)=>{
          const prevEnd = idx>0 ? laneRow[idx-1].spanE : MIN_Y;
          const nextStart = idx<laneRow.length-1 ? laneRow[idx+1].spanS : MAX_Y;
          if(item.type==="chain") html += renderChain(item.members,prevEnd,nextStart);
          else html += renderBar(item.c,prevEnd,nextStart);
        });
        html += `</div>`;
      }
    });
  });

  if(unknownCos.length){
    html += `<div class="tl-group-hdr" style="color:var(--accent3)">Dates Unknown (${unknownCos.length})</div><div style="padding-top:4px">`;
    unknownCos.forEach(c=>{
      const isSel = SEL && SEL.kind==='co' && SEL.id===c.id;
      html += `<div class="tl-unknown-item${isSel?" sel":""}" onclick="selCo('${c.id}')">
        <div class="tl-unknown-dot" style="background:${NODE_COL[dispRegion(c)]||"#888"}"></div>
        <span>${c.name}</span>
        <span style="font-size:10px;opacity:.7">(${c.region?c.region+", ":""}${c.country})</span>
      </div>`;
    });
    html += `</div>`;
  }

  html += `</div></div>`;
  el.innerHTML = html;
}

function renderBar(c,prevEnd=MIN_Y,nextStart=MAX_Y,inChain=false,chainIdx=0,chainLen=1){
  const {s:cs,e:ce} = coreSpan(c);
  const {left:extL,right:extR} = extensions(c);
  const compEnd = isActive(c) ? MAX_Y : (effClosed(c)||ce);
  const bg = barBg(c), fg = barFg(c);
  const active = isActive(c);
  const statusCls = `s-${c.status||"confirmed"}`;
  const tip = makeTip(c);
  const isSel = SEL && SEL.kind==='co' && SEL.id===c.id;
  const isHit = SEARCH_Q && (matchesSearch(c.name) || matchesSearch(c.notes) || matchesSearch(c.region));
  const lblTxt = barName(c);
  let h = "";
  if(extL) h += `<div class="tl-ext" style="left:${p(extL.s)};width:${pw(extL.s,extL.e)};background:${bg}"></div>`;
  if(extR) h += `<div class="tl-ext" style="left:${p(extR.s)};width:${pw(extR.s,extR.e)};background:${bg}"></div>`;
  const barPct = (ce-cs)/SPAN*100, txtPct = lblTxt.length*5.2/900*100, GAP = 4/900*100;
  const rightAvail = (Math.min(nextStart,MAX_Y)-ce)/SPAN*100-GAP;
  const leftAvail  = (cs-Math.max(prevEnd,MIN_Y))/SPAN*100-GAP;
  const overflow = txtPct-barPct;
  let labelStyle;
  if(inChain){
    // Keep label strictly within or aligned to its chain segment so neighbors never collide
    labelStyle = `left:${p(cs)};max-width:${pw(cs, Math.max(ce, nextStart-1))};overflow:hidden;text-overflow:ellipsis;text-align:left;padding-right:4px;`;
  } else if(overflow<=0) labelStyle=`left:${p(cs)};width:${pw(cs,ce)};text-align:center;`;
  else if(rightAvail>=overflow) labelStyle=`left:${p(cs)};width:auto;text-align:left;`;
  else if(leftAvail>=overflow) labelStyle=`left:${p(ce)};width:auto;text-align:left;transform:translateX(-100%);`;
  else labelStyle=rightAvail>=leftAvail?`left:${p(cs)};width:auto;text-align:left;`:`left:${p(ce)};width:auto;text-align:left;transform:translateX(-100%);`;
  h += `<div class="tl-label" style="${labelStyle}color:${fg}">${lblTxt}</div>`;
  h += `<div class="tl-bar ${statusCls}${isSel?" selected":""}${isHit?" search-hit":""}"
    style="left:${p(cs)};width:${pw(cs,ce)};background:${bg}"
    onclick="selCo('${c.id}')"
    onmouseenter="showTip(event,'${tip}')" onmouseleave="htip()"></div>`;
  if(active) h += `<div class="tl-arrow" style="left:calc(${p(compEnd)} + 2px);color:${fg}">▸</div>`;
  return h;
}

const SHORT_BAR_NAMES = {
  "aguila": "El Águila",
  "cornejo": "Industrias Cornejo",
  "vacor": "Vacor de México",
  "americantoy": "American Marble & Toy",
  "americanmarble": "American Glass Marble",
  "navarre": "Navarre",
  "leighton": "J.H. Leighton",
  "icgw": "Iowa City",
  "mfc": "M.F. Christensen",
  "veiligglas": "Veiligglas",
  "seike": "Seike / NSG",
  "isogami": "Isogami Glass",
  "midatlantic": "Mid-Atlantic WV",
  "smm": "S.M.M.",
  "das": "D.A.S.",
  "barberton": "Barberton"
};
function barName(c){
  return c.display_name || SHORT_BAR_NAMES[c.id] || c.name;
}
function renderChain(members,prevEnd=MIN_Y,nextStart=MAX_Y){
  let h = "";
  members.forEach((c,i)=>{
    const cPrevEnd   = i>0 ? coreSpan(members[i-1]).e : prevEnd;
    const cNextStart = i<members.length-1 ? coreSpan(members[i+1]).s : nextStart;
    h += renderBar(c,cPrevEnd,cNextStart,true,i,members.length);
    if(i<members.length-1){
      const next = members[i+1];
      const gapS = effClosed(c)||coreSpan(c).e;
      const gapE = next.founded||MIN_Y;
      if(gapE>=gapS){
        h += `<div class="tl-chain-gap" style="left:${p(gapS)};width:${pw(gapS,Math.max(gapS+0.8,gapE))}">
          <span style="position:absolute;right:-4px;top:-6px;font-size:8px;color:rgba(255,255,255,.55)">⟶</span>
        </div>`;
      }
    }
  });
  return h;
}

function makeTip(c){
  const ec = effClosed(c);
  const yr = c.founded ? `${c.precision!=="exact"?"c.":""}${c.founded}–${isActive(c)?"active":(ec||"?")}` : "dates unknown";
  const mb = (c.started||c.stopped) ? ` | marbles: ${c.started||"?"}–${c.stopped||(c.marbles_active?"active":"?")}` : "";
  return `${c.name} (${c.entry_type}) | ${yr}${mb}${c.region?" | "+c.region:""}`.replace(/'/g,"&#39;");
}

// ── NETWORK GRAPH VIEW ────────────────────────────────────────────────────────
let sim;
function renderGR(){
  const container = document.getElementById("gv");
  ["g-lone-list","g-instr-el"].forEach(id=>{const el=document.getElementById(id);if(el)el.remove();});

  const svg = d3.select("#gsvg"); svg.selectAll("*").remove();
  const visible = COS.filter(vis);
  const visIds = new Set(visible.map(c=>c.id));

  const links = CONNS.filter(c =>
    c.from && c.to &&
    visIds.has(c.from) && visIds.has(c.to) &&
    CONN_TYPES.has(c.type) &&
    connVis(c)
  ).map(c=>({...c, source:c.from, target:c.to}));

  const connected = new Set();
  links.forEach(l=>{connected.add(l.from);connected.add(l.to);});
  const graphNodes = visible.filter(c=>connected.has(c.id));
  const loneNodes  = visible.filter(c=>!connected.has(c.id));

  const w = container.clientWidth||800, h = (container.clientHeight||520) - (loneNodes.length?64:0);
  svg.attr("width",w).attr("height",container.clientHeight||520);
  const g = svg.append("g");
  svg.call(d3.zoom().scaleExtent([0.25,3.5]).on("zoom",e=>g.attr("transform",e.transform)));

  // Optional chronological background axis in Graph mode
  if(GRAPH_CHRONO){
    const xScale = d3.scaleLinear().domain([1845, 2025]).range([70, w-70]);
    const axisG = g.append("g").attr("class","chrono-axis");
    [1850,1875,1900,1925,1950,1975,2000,2025].forEach(yr=>{
      const x = xScale(yr);
      axisG.append("line").attr("x1",x).attr("x2",x).attr("y1",20).attr("y2",h-20)
        .attr("stroke","#333230").attr("stroke-dasharray","3,3").attr("opacity",0.5);
      axisG.append("text").attr("x",x).attr("y",28).attr("text-anchor","middle")
        .attr("fill","#8a8680").attr("font-size","10px").text(yr);
    });
  }

  const defs = svg.append("defs");
  [...new Set(links.map(l=>l.type))].forEach(t=>{
    const col = TYPE_COL[t]||"#888";
    defs.append("marker").attr("id","arr-"+t)
      .attr("viewBox","0 -4 8 8").attr("refX",18).attr("refY",0)
      .attr("markerWidth",6).attr("markerHeight",6).attr("orient","auto")
      .append("path").attr("d","M0,-4L8,0L0,4").attr("fill",col).attr("opacity",.8);
  });

  const nodes = graphNodes.map(c=>({...c}));
  const link = g.append("g").selectAll("line").data(links).enter().append("line")
    .attr("class","glink")
    .attr("stroke",d=>TYPE_COL[d.type]||"#888")
    .attr("stroke-dasharray",d=>TYPE_DASH[d.type] || (d.status!=="confirmed"?"4,3":null))
    .attr("marker-end",d=>d.direction==="undirected"?null:`url(#arr-${d.type})`)
    .on("mouseenter",(e,d)=>{
      const pName = d.person ? (PEOPLE.find(p=>p.id===d.person)?.name || d.person) : "";
      showTip(e, `${d.type.toUpperCase()}: ${d.from} → ${d.to}${d.year?" ("+d.year+")":""}${pName?" | "+pName:""}${d.notes?" — "+d.notes:""}`);
    })
    .on("mouseleave",htip)
    .on("click",(e,d)=>{e.stopPropagation();selCo(d.from);});

  const node = g.append("g").selectAll("g.gnode").data(nodes).enter().append("g")
    .attr("class","gnode")
    .call(d3.drag()
      .on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y;})
      .on("drag", (e,d)=>{d.fx=e.x;d.fy=e.y;})
      .on("end",  (e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}))
    .on("click",(e,d)=>{e.stopPropagation();selCo(d.id);})
    .on("mouseenter",(e,d)=>showTip(e,makeTip(d)))
    .on("mouseleave",htip);

  node.append("circle")
    .attr("r",d=>{const deg=links.filter(l=>l.from===d.id||l.to===d.id).length;return Math.max(7,Math.min(19,7+deg*1.3));})
    .attr("fill",d=>NODE_COL[dispRegion(d)]||"#888")
    .attr("fill-opacity",d=>d.status==="probable"||d.status==="estimate"?.55:.9)
    .attr("stroke",d=>(SEL&&SEL.kind==='co'&&SEL.id===d.id)?"#fff":(NODE_COL[dispRegion(d)]||"#888"))
    .attr("stroke-width",d=>(SEL&&SEL.kind==='co'&&SEL.id===d.id)?2.5:1.5);

  node.append("text")
    .attr("dy",d=>{const deg=links.filter(l=>l.from===d.id||l.to===d.id).length;return-(Math.max(7,Math.min(19,7+deg*1.3))+4);})
    .attr("text-anchor","middle").text(d=>barName(d).split("/")[0].trim());

  svg.on("click",()=>{SEL=null;clrHL();renderPanel();});

  const xScale = d3.scaleLinear().domain([1845, 2025]).range([70, w-70]);
  sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d=>d.id).distance(GRAPH_CHRONO ? 70 : 95))
    .force("charge", d3.forceManyBody().strength(GRAPH_CHRONO ? -140 : -240))
    .force("collide", d3.forceCollide(26));

  if(GRAPH_CHRONO){
    sim.force("x", d3.forceX(d => xScale(d.founded || 1950)).strength(0.85))
       .force("y", d3.forceY(h/2).strength(0.18));
  } else {
    sim.force("center", d3.forceCenter(w/2, h/2));
  }

  sim.on("tick",()=>{
    link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
        .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    node.attr("transform",d=>`translate(${d.x},${d.y})`);
  });

  if(loneNodes.length){
    const loneEl = document.createElement("div");
    loneEl.id = "g-lone-list"; loneEl.className = "g-lone";
    loneEl.innerHTML = `<span style="font-size:9px;text-transform:uppercase;letter-spacing:.08em;opacity:.7;margin-right:4px">Unlinked under current filter (${loneNodes.length}):</span>`
      + loneNodes.map(c=>`<span class="lone-chip" onclick="selCo('${c.id}')">${c.name}</span>`).join("");
    container.appendChild(loneEl);
  }
  if(SEL && SEL.kind==='co') hlNode(SEL.id);
}

function hlNode(id){
  if(!id){clrHL();return;}
  const rel = new Set([id]);
  CONNS.forEach(c=>{
    if(!CONN_TYPES.has(c.type) || !connVis(c)) return;
    if(c.from===id&&c.to) rel.add(c.to);
    if(c.to===id&&c.from) rel.add(c.from);
  });
  d3.selectAll(".gnode").classed("dim",d=>!rel.has(d.id));
  d3.selectAll(".glink").classed("dim",l=>l.from!==id&&l.to!==id).classed("hi",l=>l.from===id||l.to===id);
}
function clrHL(){
  d3.selectAll(".gnode").classed("dim",false);
  d3.selectAll(".glink").classed("dim",false).classed("hi",false);
}

  {title:"Howdyshell & Fox Family (Marble King)", ids:["howdyshell_roger","howdyshell_jean","fox_beri"]},

  {title:"Christensen Family (MFC)", ids:["christensen_mf","christensen_charles"]},
  {title:"Greiner Family (Lauscha)", ids:["greiner_elias","greiner_septimus"]},

function personCompanies(pid){
  const set = new Set();
  CONNS.forEach(c=>{
    if(c.person === pid){
      if(c.from) set.add(c.from);
      if(c.to) set.add(c.to);
    }
  });
  return [...set].map(cid=>COS.find(x=>x.id===cid)).filter(Boolean);
}

function renderPV(){
  const el = document.getElementById("pv");
  let html = "";

  // 1. Family Dynasties section
  if(PEOPLE_FILTER === "all" || PEOPLE_FILTER === "dynasties"){
    html += `<div>
      <div class="pv-section-title">
        <div>Family Dynasties &amp; Kinship Network</div>
        <span>${DYNASTY_GROUPS.length} families · ${RELS.length} documented kinship links</span>
      </div>
      <div class="dynasty-grid">`;

    DYNASTY_GROUPS.forEach(dg=>{
      const famRels = RELS.filter(r =>
        (dg.ids.includes(r.a) || dg.ids.includes(r.b)) &&
        (!CONFIRMED_ONLY || r.status === "confirmed")
      );
      if(!famRels.length && CONFIRMED_ONLY) return;

      // Gather companies associated with this family
      const famCos = new Map();
      dg.ids.forEach(pid=>{
        personCompanies(pid).forEach(co=>famCos.set(co.id, co));
      });

      html += `<div class="dynasty-card">
        <div class="dynasty-hdr">
          <div class="dynasty-title">${dg.title}</div>
          <div class="dynasty-co-pills">
            ${[...famCos.values()].map(co=>`<span class="co-mini-pill" onclick="selCo('${co.id}')">${co.name.split(" ")[0]}</span>`).join("")}
          </div>
        </div>`;

      famRels.forEach(r=>{
        const pa = PEOPLE.find(p=>p.id===r.a);
        const pb = PEOPLE.find(p=>p.id===r.b);
        if(!pa || !pb) return;
        html += `<div class="rel-row">
          <span class="p-chip" onclick="selPerson('${pa.id}')">${pa.name}</span>
          <span class="rel-badge">${r.type} →</span>
          <span class="p-chip" onclick="selPerson('${pb.id}')">${pb.name}</span>
          <span class="badge badge-tier">${r.tier}</span>
          ${r.status!=="confirmed"?`<span class="badge badge-probable">${r.status}</span>`:""}
          ${r.notes?`<div class="rel-note">${r.notes}</div>`:""}
          ${inlineSources(r.source)}
        </div>`;
      });

      html += `</div>`;
    });

    html += `</div></div>`;
  }

  // 2. People Directory / Bridge Figures
  if(PEOPLE_FILTER !== "dynasties"){
    let ppl = PEOPLE.filter(p=>{
      if(CONFIRMED_ONLY && p.status !== "confirmed") return false;
      if(SEARCH_Q && !matchesSearch(p.name) && !matchesSearch(p.notes) && !matchesSearch(p.country)) return false;
      const cos = personCompanies(p.id);
      if(PEOPLE_FILTER === "bridges") return cos.length >= 2;
      if(PEOPLE_FILTER === "founders") return CONNS.some(c=>c.person===p.id && c.type==="founded");
      return true;
    });

    // Sort by number of linked companies descending, then name
    ppl.sort((a,b)=>personCompanies(b.id).length - personCompanies(a.id).length || a.name.localeCompare(b.name));

    const secTitle = PEOPLE_FILTER==="bridges" ? "Multi-Company Bridge Figures (2+ Factories)"
                   : PEOPLE_FILTER==="founders" ? "Company Founders"
                   : "Industry Figures & Collaborators Directory";

    html += `<div>
      <div class="pv-section-title">
        <div>${secTitle}</div>
        <span>Showing ${ppl.length} of ${PEOPLE.length} people</span>
      </div>
      <div class="bridge-grid">`;

    ppl.forEach(p=>{
      const cos = personCompanies(p.id);
      const isSel = SEL && SEL.kind==='person' && SEL.id===p.id;
      const life = (p.born||p.died) ? `${p.born||"?"}–${p.died||""}` : (p.country||"");
      html += `<div class="person-card${isSel?" sel":""}" onclick="selPerson('${p.id}')">
        <div class="pc-top">
          <div class="pc-name">${p.name}</div>
          <div class="pc-dates">
            ${life}
            ${p.tier?`<span class="badge badge-tier">${p.tier}</span>`:""}
          </div>
        </div>
        <div class="pc-notes">${p.notes||"—"}</div>
        <div class="pc-cos">
          ${cos.map(co=>`<span class="co-mini-pill" onclick="event.stopPropagation();selCo('${co.id}')">${co.name}</span>`).join("")}
        </div>
        ${inlineSources(p.source)}
      </div>`;
    });

    html += `</div></div>`;
  }

  el.innerHTML = html;
}

// ── SOURCE URL PARSER & READABLE LABELS ───────────────────────────────────────
function readableUrlLabel(u){
  try {
    if(u.includes("patents.google.com")){
      const pat = u.split("/patent/")[1]?.split("/")[0] || "Patent";
      return `Patent ${pat}`;
    }
    if(u.includes("law.justia.com")) return "Justia US Federal Court Case (18 F.Supp. 305)";
    if(u.includes("catalog.hathitrust.org")) return "HathiTrust Digital Library Record";
    if(u.includes("find-and-update.company-information.service.gov.uk")) return "UK Companies House Registry";
    if(u.includes("westvirginiamarblecollectorsclub.com")){
      const slug = u.split("/").filter(Boolean).pop().replace(/-/g," ");
      return `WVMCC: ${slug.charAt(0).toUpperCase()+slug.slice(1)}`;
    }
    if(u.includes("marbleconnection.com/joemarbles")){
      const raw = decodeURIComponent(u.split("/").pop().replace(".html",""));
      return `Joe's Marbles: ${raw}`;
    }
    if(u.includes("marbleconnection.com/topic/")){
      const raw = u.split("/topic/")[1]?.split("/")[0]?.replace(/^\d+-/,"").replace(/-/g," ") || "Thread";
      return `Marble Connection: ${raw}`;
    }
    if(u.includes("thesecretlifeofmarbles.com")){
      const slug = u.split("/").filter(Boolean).pop().replace(/-/g," ");
      return `Secret Life of Marbles: ${slug}`;
    }
    if(u.includes("marblecollecting.com")){
      const slug = u.split("/").filter(Boolean).pop().replace(/-/g," ");
      return `MarbleCollecting Guide: ${slug}`;
    }
    if(u.includes("buymarbles.com")){
      const slug = u.split("/").filter(Boolean).pop().replace("marblealan-","Marble Alan: ");
      return slug;
    }
    if(u.includes("allaboutmarbles.com/viewtopic.php")){
      const t = u.split("t=")[1]?.split("&")[0] || u.split("p=")[1]?.split("#")[0] || "thread";
      return `All About Marbles (#${t})`;
    }
    if(u.includes("briangrahamglass.com")) return "Brian Graham Glass: Elias Greiner History";
    if(u.includes("biblefreak.org")) return "JABO History & Gallery Archive";
    let dom = u.replace(/^https?:\/\/(www\.)?/,"").split("/")[0];
    return dom;
  } catch(e){
    return u;
  }
}

function inlineSources(srcStr){
  if(!srcStr) return "";
  const urls = srcStr.split(";").map(s=>s.trim()).filter(Boolean);
  if(!urls.length) return "";
  return `<div class="inline-src-row">` + urls.map(u => {
    if(u.startsWith("http")){
      return `<a class="src-link" href="${u}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="${u}">↗ ${readableUrlLabel(u)}</a>`;
    }
    return `<span class="src-link" style="cursor:default">${u}</span>`;
  }).join("") + `</div>`;
}

function formatSources(srcStr, title="Primary & Secondary Sources"){
  if(!srcStr) return "";
  const urls = srcStr.split(";").map(s=>s.trim()).filter(Boolean);
  if(!urls.length) return "";
  let h = `<div class="psec">${title} (${urls.length})</div><div class="src-list">`;
  urls.forEach(u=>{
    if(u.startsWith("http")){
      h += `<a class="src-link" href="${u}" target="_blank" rel="noopener" title="${u}">↗ ${readableUrlLabel(u)}</a>`;
    } else {
      h += `<span class="src-link" style="cursor:default">${u}</span>`;
    }
  });
  h += `</div>`;
  return h;
}


// ── SOURCES & METHODOLOGY VIEW ────────────────────────────────────────────────
function categorizeUrl(u){
  if(u.includes("patents.google.com") || u.includes("law.justia.com") || u.includes("catalog.hathitrust.org") || u.includes("company-information.service.gov.uk") || u.includes("findagrave.com")){
    return "T1 · Patents, Court Records & Official Registries";
  }
  if(u.includes("westvirginiamarblecollectorsclub.com")){
    return "T2 · West Virginia Marble Collectors Club (WVMCC)";
  }
  if(u.includes("marbleconnection.com/joemarbles") || u.includes("buymarbles.com") || u.includes("marblecollecting.com")){
    return "T2 · Joe's Marbles, Marble Alan & Reference Guides";
  }
  if(u.includes("thesecretlifeofmarbles.com") || u.includes("briangrahamglass.com") || u.includes("biblefreak.org") || u.includes("ouriowaheritage.com") || u.includes("farbglashuette-lauscha.de") || u.includes("kog.com") || u.includes("marblekingusa.com") || u.includes("houseofmarbles.com") || u.includes("matsuno-i.com")){
    return "T1/T2 · Specialist Historical Research & Manufacturer Archives";
  }
  return "T2/T3 · Collector Forums & Community Archives (All About Marbles / Marble Connection)";
}

function renderSV(){
  const el = document.getElementById("sv");

  const urlMap = new Map();
  const addUrl = (rawStr, refObj) => {
    if(!rawStr) return;
    rawStr.split(";").map(s=>s.trim()).filter(s=>s.startsWith("http")).forEach(u=>{
      if(!urlMap.has(u)) urlMap.set(u, {url:u, cat:categorizeUrl(u), cos:new Map(), people:new Map()});
      const entry = urlMap.get(u);
      if(refObj.co) entry.cos.set(refObj.co.id, refObj.co);
      if(refObj.person) entry.people.set(refObj.person.id, refObj.person);
    });
  };

  COS.forEach(c => addUrl(c.source, {co:c}));
  CONNS.forEach(conn => {
    const coFrom = conn.from ? COS.find(x=>x.id===conn.from) : null;
    const coTo   = conn.to   ? COS.find(x=>x.id===conn.to)   : null;
    const pp     = conn.person ? PEOPLE.find(x=>x.id===conn.person) : null;
    addUrl(conn.source, {co:coFrom||coTo, person:pp});
  });
  PEOPLE.forEach(p => addUrl(p.source, {person:p}));
  RELS.forEach(r => {
    const pa = PEOPLE.find(x=>x.id===r.a);

  let entries = [...urlMap.values()];
  if(SEARCH_Q){
    entries = entries.filter(e =>
      matchesSearch(e.url) ||

        <b>AI Disclosure &amp; Methodology:</b> Generative AI tools (<b>Claude</b> and <b>Gemini</b>) were used to develop this interactive web interface and to audit the relational spreadsheet for chronological and cross-reference inconsistencies. All historical claims remain anchored to the human-collated source links below.<br><br>
        <b>Work in Progress — Corrections &amp; Additions Welcome:</b> Marble history contains many gaps, factory rumours, and evolving archival discoveries. If you spot an error, have primary documentation to upgrade a <i>Probable</i> or <i>Unconfirmed</i> link, or want to suggest a source, please use the <a class="fb-btn" style="padding:1px 7px;vertical-align:middle;margin:0 3px" href="${FEEDBACK_URL}" target="_blank" rel="noopener">✉ Feedback Form ↗</a>, open an issue on <a class="pco-link" href="https://github.com/Peardrop" target="_blank" rel="noopener">↗ Peardrop GitHub</a>, or reach out on the marble collector forums (<b>Peardrop</b>).
      </p>
      <div class="rubric-grid">
        <div class="rubric-card">
          <div class="rubric-hdr"><span>Tier 1 (T1)</span><span class="badge badge-confirmed">Primary</span></div>

function selCo(id){
  htip();
  if(SEL && SEL.kind==='co' && SEL.id===id) SEL = null;
  else SEL = {kind:'co', id};
  refreshActiveView();
  renderPanel();
}

function selPerson(id){
  if(SEL && SEL.kind==='person' && SEL.id===id) SEL = null;
  else SEL = {kind:'person', id};
  refreshActiveView();
  renderPanel();
}

function refreshActiveView(){
  if(VIEW==="tl") renderTL();
  else if(VIEW==="gr") hlNode(SEL && SEL.kind==='co' ? SEL.id : null);
  else if(VIEW==="pv") renderPV();
  else if(VIEW==="sv") renderSV();
}

function renderPanel(){
  const panel = document.getElementById("panel");
  if(!SEL){ panel.classList.remove("vis"); return; }

  if(SEL.kind === "co"){
    const c = COS.find(x=>x.id===SEL.id);
    if(!c){ panel.classList.remove("vis"); return; }

    const ec = effClosed(c);
    const yearStr = c.founded
      ? `${c.precision!=="exact"?"c. ":""}${c.founded}–${isActive(c)?"active":(ec||"?")}`
      : "dates unknown";
    const mbStr = (c.started||c.stopped)
      ? `<br>Marbles: ${c.started||"?"}–${c.stopped||(c.marbles_active?"active":"?")}` : "";

    const out = CONNS.filter(x=>x.from===c.id && x.to && x.type!=="founded" && connVis(x));
    const inn = CONNS.filter(x=>x.to===c.id && x.from && x.type!=="founded" && connVis(x));
    const unaryPatents = CONNS.filter(x=>x.from===c.id && !x.to && x.type==="patent" && connVis(x));
    const unaryMilestones = CONNS.filter(x=>x.from===c.id && !x.to && x.type!=="patent" && x.type!=="founded" && !x.person && connVis(x));

    const founderConns = CONNS.filter(x=>x.from===c.id && x.type==="founded" && x.person && connVis(x));
    const otherPeopleConns = CONNS.filter(x=>(x.from===c.id||x.to===c.id) && x.type!=="founded" && x.person && connVis(x));

    const ch = idToChain.get(c.id);
    let chainHTML = "";
    if(ch){
      chainHTML = `<div class="psec">Lineage / Renamed Chain</div>`;
      ch.forEach(cid=>{
        const cx = COS.find(x=>x.id===cid);
        if(!cx) return;
        const ec2 = effClosed(cx);
        chainHTML += `<div style="font-size:11px;padding:2px 0;cursor:pointer;color:${cid===c.id?"var(--accent)":"var(--text-muted)"}" onclick="selCo('${cx.id}')">
          ${cid===c.id?"▶":"•"} ${cx.name} ${cx.founded?"("+cx.founded+"–"+(isActive(cx)?"active":(ec2||"?"))+")":""}
        </div>`;
      });
    }

    const cr = (conn,dir)=>{
      const otherId = dir==="out" ? conn.to : conn.from;
      const other = COS.find(x=>x.id===otherId);
      const person = conn.person ? PEOPLE.find(p=>p.id===conn.person) : null;
      const yrSpan = conn.year ? (conn.year_end ? `${conn.year}–${conn.year_end}` : conn.active ? `${conn.year}–active` : `${conn.year}`) : "";
      return `<div class="pconn">
        <span class="cpill cpill-${conn.type}">${conn.type}</span>
        ${dir==="out"?"→":"←"} ${other?`<span class="pco-link" onclick="selCo('${other.id}')">${other.name}</span>`:"—"}
        ${yrSpan?`<span style="color:var(--text-muted);font-size:10px">(${yrSpan})</span>`:""}
        ${conn.status!=="confirmed"?`<span class="badge badge-${conn.status}">${conn.status}</span>`:""}
        ${person?`<br><span style="color:var(--accent2);font-size:10.5px;cursor:pointer" onclick="selPerson('${person.id}')">↳ ◆ ${person.name}</span>`:""}
        ${conn.notes?`<div class="pnote">${conn.notes}</div>`:""}
        ${inlineSources(conn.source)}
      </div>`;
    };

    panel.innerHTML = `
      <div class="panel-hdr">
        <div class="pname">${c.name}</div>
        <button class="panel-close" onclick="SEL=null;renderPanel();refreshActiveView()">✕</button>
      </div>
      <div class="pmeta">
        <span style="color:var(--text);font-weight:500">${c.entry_type}</span> · ${c.region?c.region+", ":""}${c.country}<br>
        ${yearStr}${mbStr}
        <span class="badge badge-${c.status}">${c.status}</span>
        ${c.precision&&c.precision!=="exact"?`<span class="badge badge-tier">${c.precision}</span>`:""}
        ${c.notes?`<div class="pnote" style="margin-top:5px;color:var(--text)">${c.notes}</div>`:""}
      </div>
      ${founderConns.length?`<div class="psec">Founders (${founderConns.length})</div>`+founderConns.map(fc=>{
        const pp = PEOPLE.find(p=>p.id===fc.person);
        if(!pp) return "";
        return `<div class="pperson" onclick="selPerson('${pp.id}')">◆ ${pp.name} ${fc.year?`<span style="color:var(--text-muted);font-size:10px">(${fc.year}${fc.year_end?"–"+fc.year_end:""})</span>`:""}${pp.notes?`<div class="pnote">${pp.notes}</div>`:""}</div>`;
      }).join(""):""}
      ${chainHTML}
      ${unaryPatents.length?`<div class="psec">Patents (${unaryPatents.length})</div>`+unaryPatents.map(up=>{
        const pp = up.person ? PEOPLE.find(p=>p.id===up.person) : null;
        return `<div class="pconn"><span class="cpill cpill-patent">patent</span> ${up.year||""}${up.year_end&&up.year_end!==up.year?"–"+up.year_end:""} ${pp?`<span style="color:var(--accent2);cursor:pointer" onclick="selPerson('${pp.id}')">◆ ${pp.name}</span>`:""}<div class="pnote">${up.notes}</div>${inlineSources(up.source)}</div>`;
      }).join(""):""}
      ${unaryMilestones.length?`<div class="psec">Other Milestones (${unaryMilestones.length})</div>`+unaryMilestones.map(um=>{
        const yrSpan = um.year ? (um.year_end ? `${um.year}–${um.year_end}` : um.active ? `${um.year}–active` : `${um.year}`) : "";
        return `<div class="pconn"><span class="cpill cpill-${um.type}">${um.type}</span> ${yrSpan?`<span style="color:var(--text-muted);font-size:10px">(${yrSpan})</span>`:""}<div class="pnote">${um.notes}</div>${inlineSources(um.source)}</div>`;
      }).join(""):""}
      ${out.length?`<div class="psec">Connections Out (${out.length})</div>${out.map(x=>cr(x,"out")).join("")}`:""}
      ${inn.length?`<div class="psec">Connections In (${inn.length})</div>${inn.map(x=>cr(x,"in")).join("")}`:""}
      ${otherPeopleConns.length?`<div class="psec">Staff, Collaborators &amp; Visitors (${otherPeopleConns.length})</div>`+otherPeopleConns.map(oc=>{
        const pp = PEOPLE.find(p=>p.id===oc.person);
        if(!pp) return "";
        return `<div class="pperson" onclick="selPerson('${pp.id}')">
          <span class="cpill cpill-${oc.type}">${oc.type}</span> ◆ ${pp.name}
          ${oc.year?`<span style="color:var(--text-muted);font-size:10px">(${oc.year}${oc.year_end?"–"+oc.year_end:oc.active?"–active":""})</span>`:""}
          ${oc.notes?`<div class="pnote">${oc.notes}</div>`:""}
        </div>`;
      }).join(""):""}
      ${formatSources(c.source)}
    `;
    panel.classList.add("vis");
  } else if(SEL.kind === "person"){
    const p = PEOPLE.find(x=>x.id===SEL.id);
    if(!p){ panel.classList.remove("vis"); return; }

    const pConns = CONNS.filter(c=>c.person===p.id && connVis(c));
    const pRels  = RELS.filter(r=>(r.a===p.id || r.b===p.id) && (!CONFIRMED_ONLY || r.status==="confirmed"));

    panel.innerHTML = `
      <div class="panel-hdr">
        <div class="pname">◆ ${p.name}</div>
        <button class="panel-close" onclick="SEL=null;renderPanel();refreshActiveView()">✕</button>
      </div>
      <div class="pmeta">
        ${p.country?p.country+" · ":""}${(p.born||p.died)?`${p.born||"?"}–${p.died||"present"}`:"dates unrecorded"}
        ${p.tier?`<span class="badge badge-tier">${p.tier}</span>`:""}
        <span class="badge badge-${p.status}">${p.status}</span>
        ${p.notes?`<div class="pnote" style="margin-top:5px;color:var(--text)">${p.notes}</div>`:""}
      </div>
      ${pRels.length?`<div class="psec">Family &amp; Kinship (${pRels.length})</div>`+pRels.map(r=>{
        const isA = r.a === p.id;
        const otherP = PEOPLE.find(x=>x.id===(isA ? r.b : r.a));
        const roleLbl = isA ? r.type : (r.type==="Parent"?"Child of":r.type==="Grandparent"?"Grandchild of":r.type==="Father in law"?"Son-in-law of":r.type);
        return `<div class="pconn">
          <span class="rel-badge">${roleLbl}</span>
          ${otherP?`<span style="color:var(--accent2);cursor:pointer;font-weight:500" onclick="selPerson('${otherP.id}')">◆ ${otherP.name}</span>`:""}
          <span class="badge badge-tier">${r.tier}</span>
          ${r.notes?`<div class="pnote">${r.notes}</div>`:""}
          ${inlineSources(r.source)}
        </div>`;
      }).join(""):""}
      ${pConns.length?`<div class="psec">Company Roles &amp; Milestones (${pConns.length})</div>`+pConns.map(c=>{
        const coFrom = c.from ? COS.find(x=>x.id===c.from) : null;
        const coTo   = c.to   ? COS.find(x=>x.id===c.to)   : null;
        const yrSpan = c.year ? (c.year_end ? `${c.year}–${c.year_end}` : c.active ? `${c.year}–active` : `${c.year}`) : "";
        return `<div class="pconn">
          <span class="cpill cpill-${c.type}">${c.type}</span>
          ${coFrom?`<span class="pco-link" onclick="selCo('${coFrom.id}')">${coFrom.name}</span>`:""}
          ${coTo?` → <span class="pco-link" onclick="selCo('${coTo.id}')">${coTo.name}</span>`:""}
          ${yrSpan?`<span style="color:var(--text-muted);font-size:10px">(${yrSpan})</span>`:""}
          ${c.notes?`<div class="pnote">${c.notes}</div>`:""}
          ${inlineSources(c.source)}
        </div>`;
      }).join(""):""}
      ${formatSources(p.source)}
    `;
    panel.classList.add("vis");
  }
}

function toggleF(r){
  if(FILTERS.has(r)){ if(FILTERS.size>1) FILTERS.delete(r); }
  else FILTERS.add(r);
  const map={"f-us":"US","f-mexico":"Mexico","f-europe":"Europe","f-japan":"Japan","f-china":"China"};
  document.querySelectorAll(".filter-btn").forEach(b=>{
    const entry=Object.entries(map).find(([k])=>b.classList.contains(k));
    if(entry) b.classList.toggle("active",FILTERS.has(entry[1]));
  });
  buildLegendBar(VIEW);
  if(VIEW==="tl") renderTL();
  else if(VIEW==="gr") renderGR();
}

function setEvidenceOnly(confOnly){
  CONFIRMED_ONLY = confOnly;
  document.getElementById("btn-ev-all").classList.toggle("active", !confOnly);
  document.getElementById("btn-ev-conf").classList.toggle("active", confOnly);
  if(VIEW==="tl") renderTL();
  else if(VIEW==="gr") renderGR();
  else if(VIEW==="pv") renderPV();
  if(SEL) renderPanel();
}

function toggleConnType(t){
  if(CONN_TYPES.has(t)){ if(CONN_TYPES.size>1) CONN_TYPES.delete(t); }
  else CONN_TYPES.add(t);
  buildSubControls();
  renderGR();
}

function setGraphLayout(chrono){
  GRAPH_CHRONO = chrono;
  buildSubControls();
  renderGR();
}

function setPeopleFilter(m){
  PEOPLE_FILTER = m;
  buildSubControls();
  renderPV();
}

function onSearch(val){
  SEARCH_Q = (val||"").trim().toLowerCase();
  if(VIEW==="tl") renderTL();
  else if(VIEW==="gr"){
    d3.selectAll(".gnode").classed("search-hit", d => SEARCH_Q && (matchesSearch(d.name) || matchesSearch(d.notes) || matchesSearch(d.region)));
  }
  else if(VIEW==="pv") renderPV();
  else if(VIEW==="sv") renderSV();
}

document.addEventListener("keydown", e => {
  if(e.key === "Escape" && SEL){
    SEL = null;
    renderPanel();
    refreshActiveView();
  }
});

// ── INIT ──────────────────────────────────────────────────────────────────────
buildLegendBar("tl");
document.getElementById("sticky-header").classList.add("vis");
renderTL();
</script>
</body>
</html>
